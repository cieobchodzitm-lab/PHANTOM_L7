name: Static integration checks

on:
  push:
    branches: [main, fix/vercel-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration and HTML entrypoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          root = Path('packages/app')
          config = json.loads((root / 'vercel.json').read_text())
          assert config['version'] == 2
          assert config['framework'] is None
          assert config['outputDirectory'] == '.'
          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = set()
              def handle_starttag(self, tag, attrs):
                  self.tags.add(tag)
          page = (root / 'index.html').read_text(encoding='utf-8')
          parser = PageParser()
          parser.feed(page)
          assert {'html', 'head', 'title', 'body', 'main', 'h1'} <= parser.tags
          assert 'Nie wykonuje akcji agentów' in page
          PY
      - name: HTTP smoke test
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory packages/app > /tmp/static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/ -o /tmp/page.html
          cmp packages/app/index.html /tmp/page.html
